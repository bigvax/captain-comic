name: Linux checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make pkg-config python3 libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev
      - name: Build and check
        run: make -j2 check check-resources check-ending
